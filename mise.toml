[tools]
clang-format = "23.1.3"
"conda:cppcheck" = "2.22.0"
dprint = "0.61.1"
hk = "2.5.0"
jactionlint = "2.2.0"
# PlatformIO installs packages such as tool-esptoolpy with pip from its own venv,
# but uv-created venvs do not include pip.
"pipx:platformio" = { version = "6.1.18", with = ["pip"] }
pkl = "0.32.1"
python = "3.14.2"
uv = "0.13.4"

[tasks.build]
description = "CoreS3 SE 向けファームウェアをビルド"
run = "pio run"

[tasks.test]
description = "PC 上で受信データ解析と警告判定をテスト"
run = """
mkdir -p .pio/tests
c++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined test/measurement_test.cpp -o .pio/tests/measurement_test
.pio/tests/measurement_test
"""

[tasks.upload]
description = "ビルドして CoreS3 SE に転送"
run = "pio run --target upload"

[tasks.monitor]
description = "Serial monitor を開く（115200 baud）"
run = "pio device monitor"

[tasks.ports]
description = "接続されている Serial port を一覧表示"
run = "pio device list"
